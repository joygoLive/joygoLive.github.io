# main 에 푸시되면 Cloudflare Pages 로 배포한다.
#
# 왜 Cloudflare 의 Git 연동을 안 쓰나: 이 프로젝트는 직접 업로드로 만들어졌고,
# Cloudflare 는 그것을 Git 연동으로 **전환하지 못한다** — 지우고 다시 만들어야 한다.
# 프로젝트를 지우면 D1 바인딩과 비밀값을 다시 붙여야 하므로, 대신 여기서 민다.
#
# 필요한 시크릿: CLOUDFLARE_API_TOKEN (저장소 Settings → Secrets → Actions)
# 계정 ID 는 비밀이 아니라 그대로 적는다.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 손으로도 돌릴 수 있게 — 배포만 다시 하고 싶을 때가 있다

concurrency:
  # 연달아 푸시하면 앞의 배포는 버린다. 둘이 동시에 올라가면 어느 쪽이 마지막인지
  # 알 수 없고, 늦게 시작한 옛 커밋이 나중에 끝나면 되돌아간 것처럼 보인다.
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b51b3d70c5cec181630b9e9c5f87375b
          # .assetsignore 가 정적 자산에서 뺄 것을 정한다 — 설정·문서가 딸려 올라가면
          # *.pages.dev 에서 그대로 읽힌다.
          command: pages deploy . --project-name joygolive --branch main --commit-dirty=true
