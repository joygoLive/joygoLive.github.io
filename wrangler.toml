# Cloudflare Pages 설정. 정적 파일은 저장소 루트를 그대로 쓰고, functions/ 가
# 자동으로 /api/* 로 매핑된다 — 빌드 단계는 여전히 없다.
name = "joygolive"
pages_build_output_dir = "."
compatibility_date = "2026-08-24"

[[d1_databases]]
binding = "DB"
database_name = "joygolive-ideas"
database_id = "f11bac51-950c-4219-bf2e-d69a15d7d3ef"

# 알림 멘션 대상. **비밀이 아니다** — 디스코드 사용자 ID 는 공개 값이고, 여기 이미
# 적힌 계정 ID·D1 데이터베이스 ID 와 같은 급이다. 진짜 비밀(웹훅 URL·관리자 토큰·
# 봇 토큰)은 여전히 Pages 시크릿에 있고 이 파일에 오지 않는다.
#
# **왜 공용 .env.shared 가 아니라 여기인가:** 홈페이지만 맥에서 안 돈다. 함수는
# 클라우드플레어 위에서 실행되므로 그 파일이 닿지 않고, 나머지 다섯 서비스처럼
# 파일을 읽게 만들 수도 없다. 그래서 값 하나를 여기 적는다 —
# 값을 바꿀 일이 생기면 두 곳(.env.shared 와 여기)을 같이 고쳐야 한다.
[vars]
DISCORD_MENTION_ID = "446845146277871616"
