<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- joygoLive. 세 막대의 높이 = 세 단어의 글자 수. joy 3 · go 2 · Live 4.
       세워서 바닥을 맞췄다 — 가로로 뉘면 길이 차가 「덜 채워진 글줄」로 읽혀
       불안정했는데, 세우면 막대그래프가 되어 높이 차가 당연한 것이 된다.
       색은 워드마크 체계 그대로.
       테마 분기. 못 읽는 브라우저는 라이트(검정 joy)로 떨어진다. -->
  <style>
    .bg{fill:#eef2f5;stroke:#dde4ea;stroke-width:1.2}
    .joy{fill:#0c1622} .go{fill:#c2410c} .live{fill:#0891b2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a2027;stroke:#2b333b}
      .joy{fill:#eef2f6} .go{fill:#e8873f} .live{fill:#22b8cf}
    }
  </style>
  <rect class="bg" x=".6" y=".6" width="30.8" height="30.8" rx="6.6"/>
  <rect class="joy"  x="6.5"  y="12.5" width="5" height="13.5" rx="1"/>
  <rect class="go"   x="13.5" y="17"   width="5" height="9"    rx="1"/>
  <rect class="live" x="20.5" y="8"    width="5" height="18"   rx="1"/>
</svg>
